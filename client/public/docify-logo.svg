<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Core Electric Cyan Gradient -->
    <linearGradient id="docify-cyan-grad" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Ambient Glass / Sheet Gradient -->
    <linearGradient id="docify-sheet-grad" x1="20" y1="16" x2="80" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0.85" />
    </linearGradient>

    <!-- Dynamic AI Core Glow -->
    <linearGradient id="docify-spark-grad" x1="42" y1="36" x2="68" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Dark Squircle Background for Badge / Favicon -->
    <linearGradient id="docify-bg-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>

    <filter id="docify-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast Badge Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#docify-bg-grad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="8" y="8" width="84" height="84" rx="20" fill="none" stroke="url(#docify-cyan-grad)" stroke-width="0.8" stroke-opacity="0.18" />

  <!-- Layer 1: Layered Smart Document Sheets -->
  <g opacity="0.95">
    <path d="M26 18 C26 14.6863 28.6863 12 32 12 H60 L78 30 V72 C78 75.3137 75.3137 78 72 78 H32 C28.6863 78 26 75.3137 26 72 V18 Z" fill="url(#docify-sheet-grad)" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.45" />
    <path d="M60 12 V28 C60 29.1046 60.8954 30 62 30 H78" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="#06B6D4" fill-opacity="0.25" />
    <line x1="36" y1="38" x2="52" y2="38" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" />
    <line x1="36" y1="46" x2="48" y2="46" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
  </g>

  <!-- Layer 2: Main Stylized "D" Cyber Ribbon -->
  <path d="M22 26 C22 22.6863 24.6863 20 28 20 H54 C68.3594 20 80 31.6406 80 46 C80 58.7495 70.7893 69.3496 58.6416 71.5518 L64 80 C64.7 81.1 63.8 82.5 62.5 82.5 H28 C24.6863 82.5 22 79.8137 22 76.5 V26 Z" fill="url(#docify-cyan-grad)" filter="url(#docify-glow-filter)" />

  <!-- Layer 3: Inner Negative-Space Counter of the "D" -->
  <path d="M34 32 C34 30.8954 34.8954 30 36 30 H52 C60.8366 30 68 37.1634 68 46 C68 54.8366 60.8366 62 52 62 H36 C34.8954 62 34 61.1046 34 60 V32 Z" fill="#030814" />

  <!-- Layer 4: AI Neural Quantum Spark -->
  <g>
    <circle cx="52" cy="46" r="9" fill="#06B6D4" fill-opacity="0.28" />
    <path d="M52 36 C52 42 46 46 40 46 C46 46 52 50 52 56 C52 50 58 46 64 46 C58 46 52 42 52 36 Z" fill="url(#docify-spark-grad)" />
    <circle cx="52" cy="46" r="2.2" fill="#FFFFFF" />
    <circle cx="68" cy="36" r="1.8" fill="#38BDF8" opacity="0.8" />
    <circle cx="34" cy="68" r="1.8" fill="#22D3EE" opacity="0.8" />
  </g>
</svg>
